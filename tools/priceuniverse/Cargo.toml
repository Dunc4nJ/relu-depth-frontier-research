[package]
name = "max11-price-universe"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
flate2 = "1.1"
max11-colgen = { path = "../colgen" }
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
codegen-units = 1
