[package]
name = "max11-streamrank"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
default = []
cuda = []

[dependencies]
anyhow = "1.0"
flate2 = "1.1"
max11-colgen = { path = "../colgen" }
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[build-dependencies]
cc = "1.2"

[profile.release]
lto = "thin"
codegen-units = 1
