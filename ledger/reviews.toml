residual_doubts = "Same-model-family and same-host lineage only; no T2 or human review, no independent rediscovery of adaptive direction selection, and no completeness bridge to arbitrary two-hidden-layer ReLU networks."
expected_break = "The likeliest decisive break was one semantic mismatch between a regenerated registered atom column and the frozen matrix, especially in duplicate edge occurrences or target normalization; exhaustive replay found none."
implementation_claim = "C-0010@1"
